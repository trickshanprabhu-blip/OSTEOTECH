<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joint Health - Patient Assessment</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background-color: #f1f5f9; }

    /* ── Animated header waves ── */
    .wave-layer-1 { animation: waveShift1 12s ease-in-out infinite; }
    .wave-layer-2 { animation: waveShift2  9s ease-in-out infinite; }
    @keyframes waveShift1 {
      0%,100% { transform: translateX(0); }
      50%      { transform: translateX(-28px); }
    }
    @keyframes waveShift2 {
      0%,100% { transform: translateX(0) scaleY(1); }
      50%      { transform: translateX(22px) scaleY(1.07); }
    }

    /* ── Gauge SVG ── */
    .gauge-bg {
      stroke: #E2E8F0;
      stroke-width: 14;
      fill: none;
    }
    .gauge-fill {
      stroke-width: 14;
      stroke-linecap: round;
      fill: none;
      /* Circumference for r=54: 2*PI*54 ≈ 339.3
         Arc spans ~240° so max useful length ≈ 339.3*(240/360) ≈ 226.2
         dasharray = full circumference so dashoffset drives visible arc */
      stroke-dasharray: 339.3;
      stroke-dashoffset: 339.3;   /* starts at 0% (empty) */
      transform: rotate(-210deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 1.6s cubic-bezier(0.4, 0, 0.2, 1),
                  stroke 0.4s ease;
    }

    /* Tick marks on gauge */
    .gauge-tick {
      stroke: #cbd5e1;
      stroke-width: 2;
    }

    /* ── Joint icon circles ── */
    .joint-icon { border-radius: 50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

    /* ── Card shadow ── */
    .risk-card { box-shadow: 0 4px 20px -4px rgba(14,165,233,0.1); }

    /* ── Pulse ring animation for the gauge center dot ── */
    @keyframes pingOnce {
      0%   { transform: scale(1);   opacity: 1; }
      70%  { transform: scale(2.2); opacity: 0; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .gauge-ping { animation: pingOnce 0.8s ease-out 1.7s forwards; }
  </style>
</head>
<body class="min-h-screen">

  <!-- ══════════════════════════════════
       HEADER
  ══════════════════════════════════ -->
  <header class="relative text-white pt-4 pb-10 px-6 overflow-hidden"
    style="background:linear-gradient(160deg,#0369a1 0%,#0284c7 40%,#0ea5e9 80%,#38bdf8 100%)">

    <!-- Animated wave overlay -->
    <div class="absolute inset-x-0 bottom-0 pointer-events-none overflow-hidden">
      <svg class="wave-layer-1 absolute bottom-1 w-[180%] h-16 opacity-25" viewBox="0 0 1200 80" preserveAspectRatio="none" fill="white">
        <path d="M0,40 C200,80 400,0 600,40 C800,80 1000,0 1200,40 L1200,80 L0,80 Z"/>
      </svg>
      <svg class="wave-layer-2 absolute bottom-0 w-[180%] h-10 opacity-45" viewBox="0 0 1200 60" preserveAspectRatio="none" fill="white">
        <path d="M0,30 C150,60 350,0 600,30 C850,60 1050,0 1200,30 L1200,60 L0,60 Z"/>
      </svg>
    </div>

    <!-- Top row -->
    <div class="relative z-10 flex items-center justify-between mb-4">
      <button onclick="window.location.href='patients.html'"
        class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 backdrop-blur flex items-center justify-center transition-all active:scale-95">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h1 class="text-xl font-bold tracking-tight drop-shadow-sm">Joint Health</h1>
      <div class="flex items-center bg-white/20 backdrop-blur px-3 py-1.5 rounded-full border border-white/25 gap-1.5">
        <svg class="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
          <path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"/>
        </svg>
        <span id="doctor-name" class="text-sm font-semibold text-white">dr.smith</span>
      </div>
    </div>

    <!-- Patient context pill -->
    <div class="relative z-10 bg-white/15 backdrop-blur px-4 py-2 rounded-xl flex items-center justify-between border border-white/20">
      <div class="flex items-center gap-2">
        <span id="patient-name" class="font-bold text-white text-sm">Margaret Torres</span>
        <span id="patient-id" class="text-blue-200 text-xs">#OA-6610</span>
      </div>
      <span id="patient-short-info" class="bg-blue-900/30 text-white text-[10px] font-medium px-2 py-0.5 rounded-full">72 yrs • Female</span>
    </div>
  </header>

  <!-- ══════════════════════════════════
       CONTENT
  ══════════════════════════════════ -->
  <div class="px-5 py-5 space-y-4 max-w-2xl mx-auto pb-16">

    <!-- ── Overall OA Risk Card ── -->
    <section class="risk-card bg-white rounded-3xl p-5 border border-slate-100">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-base font-bold text-slate-900">Overall OA Risk</h2>
        <span id="grade-badge" class="text-[10px] font-bold bg-red-50 text-red-700 border border-red-200 px-2.5 py-0.5 rounded-full">Grade IV</span>
      </div>

      <div class="flex items-center gap-5">
        <!-- ── Animated Gauge ── -->
        <div class="relative w-40 h-40 flex-shrink-0 flex items-center justify-center">
          <svg class="w-full h-full" viewBox="0 0 140 140">
            <!-- Tick marks (decorative) -->
            <g id="gauge-ticks"></g>
            <!-- Background arc -->
            <circle class="gauge-bg" cx="70" cy="70" r="54"/>
            <!-- Animated fill arc -->
            <circle id="gauge-fill" class="gauge-fill" cx="70" cy="70" r="54" stroke="#FBBF24"/>
          </svg>
          <!-- Center label -->
          <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
            <!-- Ping ring -->
            <div class="relative flex items-center justify-center mb-0.5">
              <div id="gauge-ping" class="gauge-ping absolute w-3 h-3 rounded-full bg-amber-400 opacity-75"></div>
              <div id="gauge-dot" class="w-3 h-3 rounded-full bg-amber-400 relative z-10"></div>
            </div>
            <span id="gauge-label" class="text-sm font-bold text-slate-700 leading-tight mt-1">Moderate</span>
            <span id="gauge-percent" class="text-2xl font-extrabold text-slate-900 leading-none">0%</span>
          </div>
        </div>

        <!-- Clinical note -->
        <div class="flex-1">
          <p id="risk-note" class="text-[13px] leading-relaxed text-slate-600">
            Moderate OA risk detected. Consider lifestyle adjustments and close monitoring.
          </p>
          <button class="mt-3 flex items-center gap-1 text-xs font-semibold text-[#0284c7] hover:underline">
            View clinical guideline
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- ── Joint-wise Risk Card ── -->
    <section class="risk-card bg-white rounded-3xl p-5 border border-slate-100">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-base font-bold text-slate-900">Joint-wise Risk</h2>
        <span class="text-xs text-slate-400 font-medium">6 assessment zones</span>
      </div>
      <!-- Joint rows rendered dynamically by JS -->
      <div id="joint-list" class="divide-y divide-slate-100"></div>
    </section>

    <!-- ── Print Button ── -->
    <button onclick="window.print()"
      class="w-full py-3.5 bg-gradient-to-r from-[#0369a1] to-[#0ea5e9] hover:from-[#0284c7] hover:to-[#38bdf8] text-white rounded-2xl font-bold shadow-md shadow-sky-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm1-13V3a1 1 0 00-1-1H9a1 1 0 00-1 1v1m8 0H8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Print the Report
    </button>

  </div>
  <!-- iOS home indicator -->
  <div class="fixed bottom-1 left-0 right-0 max-w-2xl mx-auto flex justify-center pointer-events-none">
    <div class="w-32 h-1 bg-slate-300 rounded-full"></div>
  </div>

  <!-- ══════════════════════════════════
       SCRIPTS
  ══════════════════════════════════ -->
  <script>
    // ── 1. Load all data from localStorage ──
    document.getElementById('doctor-name').textContent = localStorage.getItem('doctorUsername') || 'dr.smith';

    const pName    = localStorage.getItem('patientName')  || 'Margaret Torres';
    const pId      = localStorage.getItem('patientId')    || '#OA-6610';
    const pInfo    = localStorage.getItem('patientInfo')  || '72 yrs • Female • Left Knee OA';
    const pGrade   = localStorage.getItem('patientGrade') || 'Grade IV (End Stage)';
    const riskPct  = parseInt(localStorage.getItem('riskPercent') || '88', 10);
    const riskLbl  = localStorage.getItem('riskLabel')   || 'Very High';
    const riskClr  = localStorage.getItem('riskColor')   || '#ef4444';
    const riskNote = localStorage.getItem('riskNote')    || 'Very high OA risk. Surgical intervention strongly recommended.';
    let   joints   = [];
    try   { joints = JSON.parse(localStorage.getItem('riskJoints') || '[]'); } catch(e) {}

    // ── 2. Populate header ──
    document.getElementById('patient-name').textContent = pName;
    document.getElementById('patient-id').textContent   = pId;
    document.getElementById('patient-short-info').textContent = pInfo.split(' • ').slice(0,2).join(' • ');

    // ── 3. Grade badge ──
    const badge = document.getElementById('grade-badge');
    badge.textContent = pGrade;
    const gradeColors = {
      grade1: 'bg-emerald-50 text-emerald-700 border-emerald-200',
      grade2: 'bg-blue-50 text-sky-700 border-sky-200',
      grade3: 'bg-amber-50 text-amber-700 border-amber-200',
      grade4: 'bg-red-50 text-red-700 border-red-200',
    };
    const gKey = localStorage.getItem('patientGradeKey') || 'grade4';
    badge.className = `text-[10px] font-bold border px-2.5 py-0.5 rounded-full ${gradeColors[gKey] || gradeColors.grade4}`;

    // ── 4. Clinical note ──
    document.getElementById('risk-note').textContent = riskNote;

    // ── 5. Gauge: set color, label, then animate fill ──
    const gaugeFill    = document.getElementById('gauge-fill');
    const gaugeLabel   = document.getElementById('gauge-label');
    const gaugePct     = document.getElementById('gauge-percent');
    const gaugeDot     = document.getElementById('gauge-dot');
    const gaugePing    = document.getElementById('gauge-ping');

    // Arc parameters: circumference ≈ 339.3, arc spans ~240° out of 360°
    // So max arc length = 339.3 * (240/360) = 226.2
    // At riskPct%, offset = 339.3 - (riskPct/100)*226.2
    const CIRC     = 339.3;
    const MAX_ARC  = 226.2;
    const targetOffset = CIRC - (riskPct / 100) * MAX_ARC;

    gaugeFill.style.stroke = riskClr;
    gaugeDot.style.background  = riskClr;
    gaugePing.style.background = riskClr;
    gaugeLabel.textContent = riskLbl;

    // Animate the counter number
    function animateCounter(el, target, duration) {
      let start = 0;
      const step = Math.ceil(target / (duration / 16));
      const timer = setInterval(() => {
        start = Math.min(start + step, target);
        el.textContent = start + '%';
        if (start >= target) clearInterval(timer);
      }, 16);
    }

    // Trigger after short delay so CSS transition fires
    setTimeout(() => {
      gaugeFill.style.strokeDashoffset = targetOffset;
      animateCounter(gaugePct, riskPct, 1600);
    }, 150);

    // ── 6. Draw joint rows ──
    const jointIcons = {
      Knee:     `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>`,
      Hip:      `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 1 5 5v3a5 5 0 0 1-10 0V7a5 5 0 0 1 5-5z"/><path d="M7 16l-3 5M17 16l3 5"/></svg>`,
      Shoulder: `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M6 12a6 6 0 0 1 12 0"/></svg>`,
      Wrist:    `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect height="10" rx="3" width="10" x="7" y="7"/><path d="M10 7V4M14 7V4M10 17v3M14 17v3"/></svg>`,
      Fingers:  `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v4M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v7a6 6 0 0 0 12 0v-2"/></svg>`,
      Ankle:    `<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>`,
    };

    // Icon background colors per risk level
    const iconBg = {
      'Low':       'bg-emerald-50 border-emerald-200 text-emerald-600',
      'Moderate':  'bg-amber-50 border-amber-200 text-amber-600',
      'High':      'bg-rose-50 border-rose-200 text-rose-500',
      'Very High': 'bg-red-50 border-red-300 text-red-600',
    };

    const container = document.getElementById('joint-list');
    if (joints.length === 0) {
      // fallback defaults if no localStorage data
      joints = [
        { name:'Knee', level:'Moderate', bg:'#FEF3C7', text:'#D97706' },
        { name:'Hip',  level:'Low',      bg:'#DCFCE7', text:'#16A34A' },
        { name:'Shoulder', level:'Low',  bg:'#DCFCE7', text:'#16A34A' },
        { name:'Wrist', level:'Moderate',bg:'#FEF3C7', text:'#D97706' },
        { name:'Fingers', level:'High',  bg:'#FFE4E6', text:'#E11D48' },
        { name:'Ankle', level:'Low',     bg:'#DCFCE7', text:'#16A34A' },
      ];
    }

    joints.forEach(j => {
      const iClasses = iconBg[j.level] || iconBg.Low;
      container.innerHTML += `
        <div class="py-3 flex items-center justify-between">
          <div class="flex items-center gap-3.5">
            <div class="w-9 h-9 rounded-full border ${iClasses} flex items-center justify-center shrink-0">
              ${jointIcons[j.name] || jointIcons.Knee}
            </div>
            <span class="text-sm font-semibold text-slate-800">${j.name}</span>
          </div>
          <span class="px-4 py-1 rounded-full text-xs font-bold border"
            style="background:${j.bg};color:${j.text};border-color:${j.bg};">
            ${j.level}
          </span>
        </div>`;
    });
  </script>
</body>
</html>
